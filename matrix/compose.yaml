# HTTP QUERY passthrough matrix.
#
# nginx, apache-fcgi and caddy all share ONE php-fpm backend on purpose: it
# isolates the web server as the only variable. apache-modphp and php-builtin
# necessarily bring their own PHP, since the SAPI is the thing under test.
#
# Ports are stable and referenced by run.sh.

name: wp-http-query-matrix

services:
  # Shared FastCGI backend for nginx / apache-fcgi / caddy.
  php-fpm:
    image: php:8.3-fpm-alpine
    volumes:
      - ./probe:/var/www/html:ro
    working_dir: /var/www/html

  # 8081 baseline, 8181 hardened (limit_except GET POST)
  nginx:
    image: nginx:1.27-alpine
    depends_on: [php-fpm]
    ports:
      - "8081:80"
      - "8181:81"
    volumes:
      - ./probe:/var/www/html:ro
      - ./stacks/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # 8082 baseline, 8182 hardened (LimitExcept GET POST)
  apache-modphp:
    image: php:8.3-apache
    ports:
      - "8082:80"
      - "8182:81"
    volumes:
      - ./probe:/var/www/html:ro
      - ./stacks/apache-modphp/zz-probe.conf:/etc/apache2/conf-enabled/zz-probe.conf:ro

  # 8083 — Apache with the other SAPI path
  apache-fcgi:
    image: httpd:2.4-alpine
    depends_on: [php-fpm]
    ports:
      - "8083:80"
    volumes:
      - ./probe:/var/www/html:ro
      - ./stacks/apache-fcgi/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

  # 8084
  caddy:
    image: caddy:2-alpine
    depends_on: [php-fpm]
    ports:
      - "8084:80"
    volumes:
      - ./probe:/var/www/html:ro
      - ./stacks/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  # 8085 — affects local dev and CI, not production, but worth knowing
  php-builtin:
    image: php:8.3-cli-alpine
    ports:
      - "8085:80"
    volumes:
      - ./probe:/var/www/html:ro
    working_dir: /var/www/html
    command: php -S 0.0.0.0:80 -t /var/www/html

  # OpenLiteSpeed is NOT here yet — its config is not usefully mountable as a
  # single file and needs a build step. Tracked in README.md; do not read its
  # absence as a pass or a fail.
