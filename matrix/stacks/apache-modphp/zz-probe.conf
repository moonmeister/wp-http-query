# Dropped into /etc/apache2/conf-enabled/ in the php:apache image.
#
# Port 80 is the image's default vhost (baseline, no method restrictions).
# Port 81 adds the Apache equivalent of nginx's hardening block, to test how
# <LimitExcept> treats a verb Apache does not know.

Listen 81

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:81>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        Require all granted

        # NOTE: Apache's <Limit>/<LimitExcept> operate on method *names* as
        # strings, unlike nginx's bitmask, so QUERY is nameable here. Whether
        # an unknown method is actually reachable at all is what we are testing.
        <LimitExcept GET POST>
            Require all denied
        </LimitExcept>
    </Directory>
</VirtualHost>
