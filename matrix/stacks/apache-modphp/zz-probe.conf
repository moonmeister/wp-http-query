# Dropped into /etc/apache2/conf-enabled/ in the php:apache image.
#
# Port 80 is the image's default vhost (baseline, no method restrictions).
# Port 81 adds the Apache equivalent of nginx's hardening block, to test how
# <LimitExcept> treats a verb Apache does not know.
#
# The image's apache2.conf already grants /var/www/, which covers the :80
# baseline, so no server-level <Directory> block is defined here. An earlier
# version of this file had one with `Require all granted`, and it made the
# hardened stack a FALSE PASS — see the note below.

Listen 81

<VirtualHost *:81>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks

        # Both Require directives are method-scoped, and that is deliberate.
        #
        # Apache merges multiple Require directives in one context with an
        # implicit <RequireAny> — they are OR'd. So an unscoped
        # `Require all granted` sitting alongside <LimitExcept GET POST>
        # `Require all denied` resolves to GRANTED for DELETE/PUT/QUERY: the
        # hardening silently does nothing. Verify with `-X DELETE`, which must
        # 403; if DELETE returns 200 this stack is not testing what it claims.
        #
        # Apache's <Limit>/<LimitExcept> operate on method *names* as strings,
        # unlike nginx's bitmask, so QUERY is nameable here.
        <Limit GET POST>
            Require all granted
        </Limit>
        <LimitExcept GET POST>
            Require all denied
        </LimitExcept>
    </Directory>
</VirtualHost>
