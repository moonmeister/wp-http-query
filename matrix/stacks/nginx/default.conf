# Baseline nginx: no method restrictions.
# Mirrors a normal WordPress /wp-json/* path — try_files falls through to a
# front controller, so nginx's static handler (which 405s non-GET/HEAD/POST)
# never runs.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass   php-fpm:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# Hardened nginx: the common `limit_except GET POST { deny all; }` block.
# Expected to 403 QUERY, because nginx maps unknown verbs to NGX_HTTP_UNKNOWN
# and limit_except retains that bit. This stack exists to prove that finding
# rather than assert it.
#
# Note: `limit_except QUERY ...` cannot be tested here at all — it is a
# config-parse error on any nginx without a QUERY method identifier, so the
# container would fail to start.
server {
    listen 81;
    server_name _;
    root /var/www/html;
    index index.php;

    location / {
        limit_except GET POST { deny all; }
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        limit_except GET POST { deny all; }
        fastcgi_pass   php-fpm:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
