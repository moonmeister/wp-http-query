name: Release

# Pull requests: build the plugin zip and attach it to the run, so every PR shows the package builds.
# v* tags: check the tag against the plugin header, build the zip, and create a DRAFT GitHub
# release with it attached. A maintainer reviews and publishes the draft by hand. See RELEASING.md.
# This is the manual fallback; releases normally come from release-on-merge.yml, whose tags (pushed
# with GITHUB_TOKEN) don't trigger this workflow.

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: make dist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: make dist

      - name: Lint the PHP in the zip
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/unzipped"
          unzip -l dist/*.zip
          find "$RUNNER_TEMP/unzipped" -name '*.php' -print0 | xargs -0 -n1 php -l

      - uses: actions/upload-artifact@v7
        with:
          name: wp-http-query-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Checks the tag against the header, builds, and drafts: the same script release-on-merge.yml
      # runs, so both paths make the same release.
      - name: Check the tag, build, and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/draft-release.sh "$GITHUB_REF_NAME"
