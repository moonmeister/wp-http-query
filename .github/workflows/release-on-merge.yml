name: Release on merge

# Every push to main: if it changed the plugin header's Version to a non -dev version that has no
# tag yet (a merged version-bump PR), tag that commit v<Version>, build the zip, create a DRAFT
# GitHub release, and open a PR starting the next -dev version. Any other push is a no-op.
# See RELEASING.md.
#
# No duplicate release from release.yml: the tag is pushed with GITHUB_TOKEN, and events caused by
# GITHUB_TOKEN don't start new workflow runs (except workflow_dispatch and repository_dispatch), so
# release.yml's `push: tags` path doesn't fire for it. That path stays as the manual fallback for a
# tag pushed by a person. https://docs.github.com/en/actions/concepts/security/github_token
#
# For the same reason, the follow-up PR this opens gets no `pull_request` CI until someone pushes
# to it (or closes and reopens it). Opening it needs the repo setting "Allow GitHub Actions to
# create and approve pull requests" (Settings > Actions > General).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release if the version changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the tag and the dev-bump branch, create the release
      pull-requests: write   # open the dev-bump PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the pre-push commit, to compare versions with
          fetch-tags: true   # existing tags, so a released version is never re-released

      - name: Is this push a release?
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/release-detect.sh "$BEFORE" "$GITHUB_SHA"

      - name: Check the release
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: scripts/release-check.sh "v$VERSION"

      - name: Tag the commit
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Create the draft release
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: scripts/draft-release.sh "v$VERSION"

      - name: Open the next -dev version PR
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: scripts/open-dev-bump-pr.sh "$VERSION"
