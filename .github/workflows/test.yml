name: Decision tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 7.4: the plugin's minimum (and WordPress core's). 8.0: the oldest PHP 8.
        # 8.4: the version the local sites use.
        php: ['7.4', '8.0', '8.4']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: make check

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          echo "::group::wp-env logs"
          npx --no-install wp-env logs all --no-watch --config=.wp-env.nightly.json || true
          echo "::endgroup::"
