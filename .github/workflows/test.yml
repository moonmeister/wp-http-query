name: Decision tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: make check

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          for config in .wp-env.7.0.json .wp-env.json .wp-env.nightly.json; do
            echo "::group::wp-env logs ($config)"
            npx --no-install wp-env logs all --no-watch --config="$config" || true
            echo "::endgroup::"
          done
